info:
  name: Create Post
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/posts
  headers:
    - name: Origin
      value: http://localhost:3000
    - name: Cookie
      value: better-auth.session_token={{sessionToken}}
  body:
    type: json
    data: |-
      {
        "heroImgS3Url": "{{postHeroImgS3Url}}",
        "title": "{{postTitle}}",
        "shortDescription": "{{postShortDescription}}",
        "longDescription": "{{postLongDescription}}",
        "type": "{{postType}}",
        "location": "{{postLocation}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const stamp = Date.now();
        const suffix = String(stamp).slice(-6);

        bru.setVar("postHeroImgS3Url", "https://example.com/posts/forest-park.png");
        bru.setVar("postTitle", `Forest Park ${suffix}`);
        bru.setVar("postShortDescription", "Quiet trails, even on weekends");
        bru.setVar(
          "postLongDescription",
          "I come back to Forest Park whenever Portland feels too loud. Trails stay quiet even on weekends."
        );
        bru.setVar("postType", "HIKE");
        bru.setVar("postLocation", "NORTHWEST");
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.id) {
          bru.setVar("postId", body.id);
        }
    - type: tests
      code: |-
        test("should return 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("should return the created post", function () {
          const body = res.getBody();
          const postHeroImgS3Url = bru.getVar("postHeroImgS3Url");
          const postTitle = bru.getVar("postTitle");
          const postShortDescription = bru.getVar("postShortDescription");
          const postLongDescription = bru.getVar("postLongDescription");
          const postType = bru.getVar("postType");
          const postLocation = bru.getVar("postLocation");

          expect(body).to.have.property("id");
          expect(body).to.have.property("userId");
          expect(body).to.have.property("heroImgS3Url", postHeroImgS3Url);
          expect(body).to.have.property("title", postTitle);
          expect(body).to.have.property("shortDescription", postShortDescription);
          expect(body).to.have.property("longDescription", postLongDescription);
          expect(body).to.have.property("type", postType);
          expect(body).to.have.property("location", postLocation);
          expect(body).to.have.property("createdAt");
          expect(body).to.have.property("updatedAt");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
